[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuralstate"
version = "0.1.0"
description = "A self-evolving memory layer for autonomous agents: background consolidation into a knowledge graph and learned heuristic rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "tenacity>=8.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
openai = ["openai>=1.40"]
fastembed = ["fastembed>=0.3"]
all = ["neuralstate[anthropic,openai,fastembed]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "neuralstate[all]"]

[project.scripts]
neuralstate = "neuralstate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/neuralstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires a running Postgres + pgvector (NS_TEST_DATABASE_URL)"]
addopts = "-m 'not integration'"
